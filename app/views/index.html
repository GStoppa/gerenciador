<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarefas</title>
    <link rel="stylesheet" href="{{url_for('static', filename='style.css')}}">
</head>
<body>
    <header>

    </header>

    <main>
        <ul>
            {% for tarefa in tarefas %}
                <li>
                    <span>{{ tarefa.descricao }}</span>
                    {% if tarefa.estado %}
                        <span>Concluido</span>
                    {% else %}
                        <span>Pendente</span>
                    {% endif %}
                </li>
            {% endfor %}
        </ul>
    </main>

    <footer>

    </footer>

</html>
