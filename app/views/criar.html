{% extends "base.html" %}
{% block conteudo %}
    <form action="{{ url_for('tarefas.criar_tarefa') }}" method="POST">
        <label for="descricao">Descrição da tarefa</label>
        <input type="text" id="descricao" name="descricao" placeholder="Ex: estudar para prova" required>

        <button type="submit" class="botao botao--primario">Adicionar tarefa</button>
        <a href="{{ url_for('tarefas.lista') }}" class="botao botao--secundario">Voltar para a lista</a>
    </form>
{% endblock %}
